experiment:
  version: v17
  name: PlainUNet_ColorQuery_UICF_ParallelBranch
  seed: 3520
  output_root: experiments

data:
  root: /root/autodl-tmp/pro/publicdata/LSUI19_dup_train
  train_manifest: split/lsui19/train.tsv
  validation_manifest: split/lsui19/validation.tsv
  test_manifest: split/lsui19/test.tsv
  patch_size: 256
  batch_size: 16
  num_workers: 4
  pin_memory: true
  pad_if_smaller: true
  pad_mode: reflect
  augmentation:
    hflip: true
    vflip: true
    rot90: true

model:
  type: plain_unet_color_query_uicf_parallel_branch
  in_channels: 3
  out_channels: 3
  base_channels: 64
  use_batch_norm: true
  output_activation: sigmoid
  color_query:
    num_color_queries: 8
    token_dim: 128
    num_heads: 4
    ffn_expansion: 2.0
    dropout: 0.0
  uicf:
    feat_dim: 48
    num_frequencies: 8
    mlp_hidden_dim: 128
    mlp_hidden_layers: 3
    anchor_hidden_dim: 64
    query_chunk_size: 65536

loss:
  name: charbonnier
  epsilon: 0.001

optimizer:
  name: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  name: none

training:
  epochs: 200
  amp: true
  deterministic: false
  validate_every: 1
  save_every: 10
  gradient_clip_norm: null
  fail_on_nonfinite: true

checkpoint:
  primary: psnr
  save_best_psnr: true
  save_best_ssim: true
  save_best_val_loss: true
  save_last: true
  save_periodic: true

evaluation:
  resize: true
  size: 256

metrics:
  data_range: 1.0
  crop_border: 0
  ssim_window_size: 11
  ssim_sigma: 1.5

test:
  auto_run_after_training: false
  checkpoint: best_psnr
  save_all_enhanced_images: true
  visualization:
    enabled: true
    num_samples: 10
    random_seed: 3407
    columns: [input, enhanced, gt]
    grid_rows: 10
    grid_columns: 3
    cell_width: 256
    cell_height: 256
    preserve_aspect_ratio: false
    add_labels: false

logging:
  console: true
  save_train_log: true
  save_validation_log: true
  save_test_log: true
  save_metrics_history_json: true
  save_metrics_history_csv: true
  log_every_steps: 0
