variant: full
seed: 3520
data_root: /root/autodl-tmp/pro/publicdata/Haze4K
split_dir: split/haze4k
model:
  type: plain_unet_color_query_uicf_pre_backbone
  in_channels: 3
  out_channels: 3
  base_channels: 64
  use_batch_norm: true
  output_activation: sigmoid
  color_query:
    num_color_queries: 8
    token_dim: 128
    num_heads: 4
    ffn_expansion: 2.0
    dropout: 0.0
  uicf:
    feat_dim: 48
    num_frequencies: 8
    mlp_hidden_dim: 128
    mlp_hidden_layers: 3
    anchor_hidden_dim: 64
    query_chunk_size: 65536
data:
  batch_size: 16
  patch_size: 256
  num_workers: 4
training:
  epochs: 200
  amp: true
  amp_init_scale: 65536.0
  amp_max_scale: null
  deterministic: false
  scheduler: none
  accumulation_steps: 1
  validate_every: 1
  checkpoint_selection: best_validation_PSNR
optimizer:
  name: AdamW
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
loss:
  name: charbonnier
  epsilon: 0.001
metrics:
  data_range: 1.0
  crop_border: 0
  ssim_window_size: 11
  ssim_sigma: 1.5
evaluation:
  validation: PIL_BILINEAR_256x256
  test: PIL_BILINEAR_256x256
