experiment:
  version: v6
  name: PlainUNet_GLINR
  seed: 3520
  output_root: experiments

data:
  root: /root/autodl-tmp/pro/publicdata/LSUI19_dup_train
  train_manifest: split/lsui19/train.tsv
  validation_manifest: split/lsui19/validation.tsv
  test_manifest: split/lsui19/test.tsv
  patch_size: 256
  batch_size: 16
  num_workers: 4
  pin_memory: true
  pad_if_smaller: true
  pad_mode: reflect
  augmentation:
    hflip: true
    vflip: true
    rot90: true

model:
  type: plain_unet_glinr
  in_channels: 3
  out_channels: 3
  base_channels: 64
  use_batch_norm: true
  output_activation: sigmoid
  glinr:
    latent_dim: 128
    hidden_dim: 128
    latent_stride: 2
    global_num_frequencies: 6
    local_num_frequencies: 0
    include_raw_absolute_coordinate: true
    include_raw_relative_coordinate: true
    local_depth: 3
    global_depth: 3
    fusion_depth: 3
    query_chunk: 65536
    residual: true

loss:
  name: charbonnier
  epsilon: 0.001

optimizer:
  name: AdamW
  learning_rate: 0.0002
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  name: none

training:
  epochs: 200
  amp: true
  deterministic: false
  validate_every: 1
  save_every: 10
  gradient_clip_norm: null
  fail_on_nonfinite: true

checkpoint:
  primary: psnr
  save_best_psnr: true
  save_best_ssim: true
  save_best_val_loss: true
  save_last: true
  save_periodic: true

evaluation:
  resize: true
  size: 256

metrics:
  data_range: 1.0
  crop_border: 0
  ssim_window_size: 11
  ssim_sigma: 1.5

test:
  auto_run_after_training: false
  checkpoint: best_psnr
  save_all_enhanced_images: true
  visualization:
    enabled: true
    num_samples: 10
    random_seed: 3407
    columns: [input, enhanced, gt]
    grid_rows: 10
    grid_columns: 3
    cell_width: 256
    cell_height: 256
    preserve_aspect_ratio: false
    add_labels: false

logging:
  console: true
  save_train_log: true
  save_validation_log: true
  save_test_log: true
  save_metrics_history_json: true
  save_metrics_history_csv: true
  log_every_steps: 0
